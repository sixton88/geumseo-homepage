<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>금서메탈 홈페이지 이전 안내</title>

  <!-- 검색엔진에는 예전 주소를 노출하지 않도록 처리 -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- 3초 후 새 홈페이지로 자동 이동 -->
  <meta http-equiv="refresh" content="3; url=https://sixton88.github.io/" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f7fa;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .box {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 18px;
      padding: 34px 26px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #1f3f5b;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 14px;
      color: #111;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
      margin: 8px 0;
      color: #555;
    }

    .notice {
      margin-top: 18px;
      font-size: 14px;
      color: #777;
    }

    a.button {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 22px;
      border-radius: 999px;
      background: #1f3f5b;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }

    a.button:hover {
      background: #163149;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="logo">금서메탈</div>

    <h1>홈페이지 주소가 변경되었습니다</h1>

    <p>
      금서메탈 공식 홈페이지가<br />
      새로운 주소로 이전되었습니다.
    </p>

    <p class="notice">
      잠시 후 새 홈페이지로 자동 이동합니다.
    </p>

    <a class="button" href="https://sixton88.github.io/">
      새 홈페이지 바로가기
    </a>
  </div>
</body>
</html>
